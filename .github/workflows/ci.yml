name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codigo_futuro_test
          POSTGRES_USER: codigo_futuro
          POSTGRES_PASSWORD: codigo_futuro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codigo_futuro -d codigo_futuro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://codigo_futuro:codigo_futuro@localhost:5432/codigo_futuro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check Django configuration
        run: uv run python src/manage.py check

      - name: Check missing migrations
        run: uv run python src/manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest
