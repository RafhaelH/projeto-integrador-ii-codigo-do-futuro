name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: codigo_futuro_test
          POSTGRES_USER: codigo_futuro
          POSTGRES_PASSWORD: codigo_futuro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codigo_futuro -d codigo_futuro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://codigo_futuro:codigo_futuro@localhost:5432/codigo_futuro_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate production manifest
        run: |
          cp deploy/production.env.example deploy/production.env
          chmod 600 deploy/production.env
          docker compose --env-file deploy/production.env -f compose.production.yaml config --quiet

      - name: Build production image
        run: docker build --tag codigo-do-futuro:ci .

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check Django configuration
        run: uv run python src/manage.py check

      - name: Check missing migrations
        run: uv run python src/manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest

      - name: Validate production startup
        run: |
          sed -i \
            -e 's/SUBSTITUA_POR_UMA_CHAVE_ALEATORIA_LONGA/ci-django-key-1234567890-abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOPQRSTUVWXYZ/g' \
            -e 's/SUBSTITUA_POR_UMA_SENHA_FORTE/ci-postgres-password/g' \
            -e 's/SUBSTITUA_POR_UMA_SENHA_EXCLUSIVA_DE_AVALIACAO/ci-demo-password/g' \
            deploy/production.env
          ./deploy/deploy.sh deploy/production.env
          docker compose --env-file deploy/production.env -f compose.production.yaml exec -T app \
            python -c "import os, urllib.request; host=os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(); response=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/entrar/', headers={'Host': host, 'X-Forwarded-Proto': 'https'}), timeout=5); assert response.status == 200"

      - name: Production logs on failure
        if: failure()
        run: docker compose --env-file deploy/production.env -f compose.production.yaml logs --tail=100 app database

      - name: Clean up production smoke test
        if: always()
        run: docker compose --env-file deploy/production.env -f compose.production.yaml down --volumes
