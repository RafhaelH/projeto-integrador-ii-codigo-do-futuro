name: codigo-do-futuro

services:
  database:
    image: postgres:17-alpine
    env_file:
      - ./deploy/production.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./deploy/production.env
    depends_on:
      database:
        condition: service_healthy
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8031}:8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - media_production_data:/app/src/media
    networks:
      - backend
      - egress

networks:
  backend:
    internal: true
  egress:
    driver: bridge

volumes:
  postgres_production_data:
  media_production_data:
