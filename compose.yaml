services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codigo_futuro
      POSTGRES_USER: codigo_futuro
      POSTGRES_PASSWORD: codigo_futuro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codigo_futuro -d codigo_futuro"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
