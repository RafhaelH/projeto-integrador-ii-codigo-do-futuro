[project]
name = "codigo-do-futuro"
version = "0.1.0"
description = "Plataforma acadêmica para gestão de oficinas de programação e tecnologia."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dj-database-url>=2.3,<4",
  "django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<3.4",
  "python-dotenv>=1.1,<2",
  "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "pytest-django>=4.9,<5",
  "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=src/apps --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
