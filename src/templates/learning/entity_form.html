{% extends "base.html" %}

{% block title %}{{ page_title }} | Código do Futuro{% endblock %}

{% block content %}
<header class="page-heading"><a class="back-link" href="{{ cancel_url }}">← Voltar</a><h1>{{ page_title }}</h1>{% if page_description %}<p>{{ page_description }}</p>{% endif %}</header>
<section class="panel form-panel">
  <form method="post" class="form-stack" novalidate>
    {% csrf_token %}
    {% include "shared/form_fields.html" %}
    <div class="action-row"><button class="button button-primary" type="submit">Salvar</button><a class="button button-secondary" href="{{ cancel_url }}">Cancelar</a></div>
  </form>
</section>
{% endblock %}
