{% extends "base.html" %}

{% block title %}{{ page_title }} | Código do Futuro{% endblock %}

{% block content %}
<section class="form-page">
  <header class="page-heading">
    <span class="eyebrow">Gestão acadêmica</span>
    <h1>{{ page_title }}</h1>
  </header>

  <form class="panel form-grid" method="post" novalidate>
    {% csrf_token %}
    {% include "shared/form_fields.html" %}
    <div class="form-actions">
      <a class="button button-secondary" href="{{ cancel_url }}">Cancelar</a>
      <button class="button button-primary" type="submit">Salvar</button>
    </div>
  </form>
</section>
{% endblock %}
